<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Drivers</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --soft:#f5f5f7; --accent:#2f6fde; --mark:#fff1a8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --fg:#ececf0; --muted:#9a9aa2; --line:#2c2c30; --soft:#1f1f22; --accent:#6c9bf0; --mark:#5c4d00; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; height:100vh; }
  aside { width:340px; flex:none; border-right:1px solid var(--line); overflow:auto; padding:12px; }
  main { flex:1; overflow:auto; padding:16px 24px; }
  h1 { font-size:15px; margin:0 0 10px; }
  aside.hidden { display:none; }
  .head { display:flex; justify-content:space-between; align-items:baseline; }
  aside a, #show { cursor:pointer; }
  aside a { color:var(--accent); }
  #hide { font-size:18px; color:var(--muted); padding:0 4px; }
  #show { margin-bottom:10px; }
  details { margin-left:10px; }
  summary { cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  .node { display:flex; justify-content:space-between; gap:8px; padding:3px 6px; border-radius:6px; cursor:pointer; }
  .node:hover { background:var(--soft); }
  .node.sel { background:var(--accent); color:#fff; }
  .node.sel .cnt, .node.sel .has, .node.sel .lvl, .node.sel .car { color:#fff; }
  .car { display:inline-block; width:16px; color:var(--muted); font-size:12px; }
  .toggle { cursor:pointer; }
  .toggle:hover { color:var(--fg); }
  .toggle::before { content:"▸"; }
  details[open] > summary .toggle::before { content:"▾"; }
  .cnt { color:var(--muted); font-size:12px; white-space:nowrap; }
  .has { color:var(--accent); font-weight:600; }
  .lvl { color:var(--muted); font-size:11px; margin-right:4px; }
  .bar { display:flex; gap:12px; align-items:center; margin:8px 0 16px; flex-wrap:wrap; }
  input[type=search] { flex:1; min-width:200px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--soft); color:var(--fg); font:inherit; cursor:pointer; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:8px; margin:2px 0; }
  .k { color:var(--muted); font-size:12px; padding-top:2px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .meta a { color:var(--accent); cursor:pointer; }
  .ev, .tr { margin-top:8px; background:var(--soft); border-radius:8px; padding:8px 10px; font-size:13px; }
  .tr { max-height:320px; overflow:auto; }
  .tr div { padding:1px 4px; } .tr .hl { background:var(--mark); }
  .tr .ln, .ev .ln { color:var(--muted); display:inline-block; width:40px; }
  mark { background:var(--mark); color:inherit; }
  .muted { color:var(--muted); }
  .match { color:var(--accent); font-size:12px; margin-bottom:6px; }
  .extracted { background:var(--soft); border-left:3px solid var(--accent); border-radius:6px; padding:8px 12px; margin:-6px 0 14px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:4px 0 12px; align-items:flex-end; }
  .tab { padding:6px 14px; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; cursor:pointer; color:var(--muted); margin-bottom:-1px; }
  .tab.on { border-color:var(--line); background:var(--bg); color:var(--fg); font-weight:600; }
  .tabs .opt { margin-left:auto; padding-bottom:6px; }
  .lead { font-size:15px; margin:4px 0 14px; max-width:900px; }
  .stats { display:flex; gap:28px; flex-wrap:wrap; margin:0 0 16px; }
  .stat b { display:block; font-size:22px; font-weight:650; }
  .stat span { color:var(--muted); font-size:12px; }
  .crumb { color:var(--muted); font-size:12px; margin-bottom:2px; }
  .crumb a { color:var(--accent); cursor:pointer; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:20px 0 8px; }
  table.kids { border-collapse:collapse; width:100%; max-width:1100px; }
  table.kids td { border-top:1px solid var(--line); padding:8px 8px; vertical-align:top; }
  table.kids tr.go { cursor:pointer; } table.kids tr.go:hover td { background:var(--soft); }
  table.kids .nm { font-weight:600; } table.kids .ds { color:var(--muted); font-size:13px; }
  table.kids .num { text-align:right; white-space:nowrap; width:1%; }
  .sbar { width:140px; height:8px; background:var(--soft); border-radius:4px; overflow:hidden; margin-top:6px; }
  .sbar i { display:block; height:100%; background:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--soft); border-radius:12px; padding:2px 10px; font-size:12px; }
  .chip b { font-weight:600; }
  .val { background:var(--soft); border-radius:8px; padding:8px 12px; font-size:13px; max-width:900px; }
  ul.ex { margin:0; padding-left:18px; max-width:1100px; } ul.ex li { margin:3px 0; }
  ul.ex .muted { font-size:12px; }
  .json { background:var(--soft); border-radius:10px; padding:12px 14px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<aside id="side">
  <div class="head"><h1>Call drivers</h1><a id="hide" title="Hide panel">«</a></div>
  <div class="cnt" style="margin-bottom:8px">requests · <span class="has">records</span>
    <span style="float:right"><a id="expand">Expand all</a> · <a id="collapse">Collapse all</a></span></div>
  <div id="tree"></div>
</aside>
<main>
  <button id="show" hidden>☰ Drivers</button>
  <h1 id="title">All drivers</h1>
  <div class="tabs">
    <a class="tab on" data-tab="cluster">Cluster</a><a class="tab" data-tab="search">Search</a><a class="tab" data-tab="showcase">Showcase</a>
    <label class="opt" id="knownopt" hidden><input id="known" type="checkbox"> only known results</label>
  </div>
  <section id="cluster"></section>
  <section id="search" hidden>
    <div class="bar">
      <input id="q" type="search">
      <label title="An LLM first rewrites what you typed as a situation sentence; press Enter to search"><input id="llm" type="checkbox" checked> LLM → situation</label>
      <label title="Results below this similarity are not shown">min similarity
        <input id="min" type="number" min="0" max="1" step="0.02" value="0.70" style="width:64px"></label>
      <label><input id="agent" type="checkbox"> agent view (JSON)</label>
      <span id="count" class="muted"></span>
    </div>
    <div id="extracted" class="extracted" hidden></div>
    <div id="results"></div>
  </section>
  <section id="showcase" hidden>
    <p id="scount" class="muted"></p>
    <div id="list"></div>
  </section>
</main>
<script>
let tree = [], extracted = {}, jobs = {}, sel = null, records = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadDrivers() {
  const d = await (await fetch('/api/drivers')).json();
  tree = d.tree; extracted = d.extracted; jobs = d.jobs;
  renderTree();
  return d;
}

function nodeHtml(level, n) {
  const k = `${level}|${n.name}`, got = extracted[k] || 0;
  const isSel = sel && sel.level === level && sel.name === n.name;
  return `<div class="node${isSel ? ' sel' : ''}" data-level="${level}" data-name="${esc(n.name)}">
    <span>${level === 'L3' ? '<span class="car"></span>' : '<span class="car toggle"></span>'}<span class="lvl">${level}</span>${esc(n.name)}</span>
    <span class="cnt">${n.n}${got ? ` · <span class="has">${got}</span>` : ''}</span></div>`;
}

function allNodeHtml() {
  const total = Object.entries(extracted).filter(([k]) => k.startsWith('L1|')).reduce((a, [, v]) => a + v, 0);
  return `<div class="node${sel ? '' : ' sel'}" data-all="1" style="margin-bottom:4px">
    <span><span class="car"></span>All drivers</span><span class="cnt"><span class="has">${total}</span></span></div>`;
}

function renderTree() {
  // first render: every L1 open so all L2s show; afterwards keep whatever the user opened or closed
  const open = $('tree').children.length
    ? new Set([...document.querySelectorAll('#tree details[open]')].map(d => d.dataset.key))
    : new Set(tree.map(l1 => l1.name));
  $('tree').innerHTML = allNodeHtml() + tree.map(l1 => `
    <details data-key="${esc(l1.name)}" ${open.has(l1.name) ? 'open' : ''}><summary>${nodeHtml('L1', l1)}</summary>
      ${l1.children.map(l2 => `
        <details data-key="${esc(l2.name)}" ${open.has(l2.name) ? 'open' : ''}><summary>${nodeHtml('L2', l2)}</summary>
          ${l2.children.map(l3 => `<div style="margin-left:10px">${nodeHtml('L3', l3)}</div>`).join('')}
        </details>`).join('')}
    </details>`).join('');
}

$('tree').addEventListener('click', e => {
  const n = e.target.closest('.node');
  if (!n) return;
  // the arrow opens/closes (default <summary> behaviour); the name only selects
  if (e.target.closest('.toggle')) return;
  e.preventDefault();
  if (n.dataset.all) selectAll(); else select(n.dataset.level, n.dataset.name);
});

async function select(level, name) {
  sel = { level, name };
  history.replaceState(null, '', `#${level}/${encodeURIComponent(name)}`);
  $('title').textContent = `${level}: ${name}`;
  renderTree();
  renderCluster();
  records = await (await fetch(`/api/records?level=${level}&name=${encodeURIComponent(name)}`)).json();
  renderShowcase(); renderSearch();
}

// no driver selected: browse and search every extracted record
async function selectAll() {
  sel = null;
  history.replaceState(null, '', location.pathname);
  $('title').textContent = 'All drivers';
  renderTree();
  renderCluster();
  records = await (await fetch('/api/records')).json();
  renderShowcase(); renderSearch();
}


// Cluster tab: what step 5 found for the selected driver (or all drivers)
const pct = x => (100 * x).toFixed(1) + '%';
const LABEL = { L1: 'L1 domain', L2: 'L2 area', L3: 'L3 issue' };
async function renderCluster() {
  const want = sel ? { ...sel } : null;
  const p = sel ? `?level=${sel.level}&name=${encodeURIComponent(sel.name)}` : '';
  const resp = await fetch('/api/cluster' + p), c = await resp.json();
  if ((sel && (!want || sel.name !== want.name)) || (!sel && want)) return;  // selection changed meanwhile
  if (!resp.ok) {
    $('cluster').innerHTML = `<p class="muted">Could not load this cluster: ${esc(c.error)}.
      ${resp.status === 404 && c.error === 'not found' ? 'The server is older than this page; restart app.py.' : ''}</p>`;
    return;
  }
  const kidLevel = c.children[0] && c.children[0].level;
  const base = c.level ? c.size : c.total;  // child share: of this cluster, or of all requests
  const chips = (pairs, n) => `<div class="chips">${pairs.map(([k, v]) =>
    `<span class="chip">${esc(k)} <b>${v}</b> · ${pct(v / n)}</span>`).join('')}</div>`;
  const v = c.validation;
  $('cluster').innerHTML = `
    ${c.path.length ? `<div class="crumb">${c.path.map(x =>
      `<a data-level="${x.level}" data-name="${esc(x.name)}">${x.level} ${esc(x.name)}</a>`).join(' › ')} ›</div>` : ''}
    <p class="lead">${c.level ? esc(c.description)
      : `Call drivers discovered bottom-up from ${c.total} customer requests: clustered, named by an LLM, then grouped into L3 → L2 → L1.`}</p>
    <div class="stats">
      <div class="stat"><b>${c.size}</b><span>requests</span></div>
      <div class="stat"><b>${pct(c.share)}</b><span>of all ${c.total} requests</span></div>
      ${c.level ? `<div class="stat"><b>#${c.rank}</b><span>largest of ${c.siblings} ${LABEL[c.level]}s</span></div>`
        : `<div class="stat"><b>${c.unclustered}</b><span>unclustered (${pct(c.unclustered / c.total)})</span></div>`}
      ${c.children.length ? `<div class="stat"><b>${c.children.length}</b><span>${LABEL[kidLevel]}s</span></div>` : ''}
      ${c.coherence ? `<div class="stat"><b>${esc(c.coherence)}</b><span>coherence</span></div>` : ''}
    </div>
    ${v ? `<div class="val">Reference check: <b>${pct(v.reference_agreement)}</b> of requests map to the reference category
      <b>${esc(v.reference_category)}</b>. Most common free-text categories:
      ${Object.entries(v.top_step1_categories).map(([k, n]) => `${esc(k)} (${n})`).join(', ')}</div>` : ''}
    ${c.children.length ? `<h2>${LABEL[kidLevel]}s in this ${c.level ? 'cluster' : 'dataset'}</h2>
      <table class="kids">${c.children.map(k => `
        <tr class="go" data-level="${k.level}" data-name="${esc(k.name)}">
          <td><div class="nm">${esc(k.name)}${k.coherence === 'low' ? ' <span class="muted">(low coherence)</span>' : ''}</div>
              <div class="ds">${esc(k.description)}</div></td>
          <td class="num"><b>${k.size}</b> <span class="muted">${pct(k.size / base)}</span>
              <div class="sbar"><i style="width:${100 * k.size / c.children[0].size}%"></i></div></td>
        </tr>`).join('')}</table>` : ''}
    <h2>Request type</h2>${chips(c.request_type, c.size)}
    <h2>Outcome</h2>${chips(c.outcome, c.size)}
    <h2>Example requests ${c.examples.length < c.size ? `(${c.examples.length} of ${c.size}${c.level === 'L3' ? '' : ', spread across L3 issues'})` : ''}</h2>
    <ul class="ex">${c.examples.map(x => `<li>${esc(x.request)}
      <span class="muted">· ${esc(x.request_type)} · ${esc(x.outcome)}${c.level !== 'L3' ? ' · ' + esc(x.L3) : ''}</span></li>`).join('')}</ul>`;
}
$('cluster').addEventListener('click', e => {
  const t = e.target.closest('[data-level]');
  if (t) select(t.dataset.level, t.dataset.name);
});

let reqId = 0, timer = null;

// Search tab: empty until something is typed; results ranked by situation similarity
async function renderSearch() {
  const query = $('q').value.trim(), id = ++reqId;
  if (!query) {
    $('extracted').hidden = true;
    $('count').textContent = '';
    $('results').innerHTML = `<p class="muted">Type what the customer said to search ${sel ? 'this driver' : 'all drivers'}.</p>`;
    return;
  }
  const p = new URLSearchParams({ q: query, k: 20, known: $('known').checked ? 1 : 0,
                                  extract: $('llm').checked ? 1 : 0, min: $('min').value });
  if (sel) { p.set('level', sel.level); p.set('name', sel.name); }
  if ($('agent').checked) { p.set('k', 5); p.set('format', 'agent'); }
  $('count').textContent = $('llm').checked ? 'extracting situation…' : 'searching…';
  const resp = await fetch('/api/search?' + p), res = await resp.json();
  if (id !== reqId) return;  // a newer query is in flight
  if (!resp.ok) { $('count').textContent = res.error; return; }
  $('extracted').hidden = !res.extracted_situation;
  $('extracted').innerHTML = res.extracted_situation
    ? `<span class="k">Extracted situation (matched against records)</span><br>${esc(res.extracted_situation)}` : '';
  if ($('agent').checked) {
    $('count').textContent = `${res.results.length} results returned to the agent`;
    $('results').innerHTML = `<pre class="json">${esc(JSON.stringify(res, null, 2))}</pre>`;
    return;
  }
  $('count').textContent = res.results.length
    ? `${res.results.length} of ${records.length} records at similarity ≥ ${$('min').value}, best first`
    : `no record at similarity ≥ ${$('min').value}`;
  renderCards($('results'), res.results);
}

// Showcase tab: browse the selected driver's records (or all records), unranked
function renderShowcase() {
  if (!records.length) {
    const job = sel && jobs[`${sel.level}|${sel.name}`];
    $('scount').textContent = '';
    $('list').innerHTML = !sel ? '<p class="muted">No records extracted yet. Pick a driver on the left to extract its records.</p>'
      : job && job.state === 'running' ? '<p class="muted">Extracting… this takes a minute or two.</p>'
      : `<p class="muted">No records for this driver yet.${job && job.state === 'failed' ? ' Last run failed: ' + esc(job.log) : ''}</p>
         <button id="run">Extract records (calls the LLM once per request)</button>`;
    if ($('run')) $('run').onclick = startExtract;
    return;
  }
  const shown = records.filter(r => !$('known').checked || r.observed_result !== 'unknown');
  $('scount').textContent = `${shown.length} of ${records.length} records` + (shown.length > 300 ? ' · showing the first 300' : '');
  renderCards($('list'), shown.slice(0, 300));
}

function renderCards(box, shown) {
  const F = [['Situation', 'situation'], ['Known at decision', 'known_at_decision'],
             ['Next action', 'observed_next_action'], ['Result', 'observed_result']];
  box.innerHTML = shown.map((r, i) => `
    <div class="card">
      ${r.match ? `<div class="match">#${i + 1} · situation similarity ${r.match.similarity.toFixed(2)}</div>` : ''}
      ${F.map(([label, k]) => `<div class="row"><div class="k">${label}</div>
        <div class="${r[k] === 'unknown' ? 'muted' : ''}">${esc(r[k])}</div></div>`).join('')}
      <div class="meta">
        <span>${esc(r.source.L3)}</span><span>${esc(r.source.genuuid)} · step ${r.source.step}</span>
        <a data-i="${i}" data-act="ev">evidence</a><a data-i="${i}" data-act="tr">transcript</a>
      </div>
      <div class="slot"></div>
    </div>`).join('');
  box.onclick = e => toggle(e, shown);
}

async function toggle(e, shown) {
  const a = e.target.closest('a[data-act]');
  if (!a) return;
  const r = shown[+a.dataset.i], slot = a.closest('.card').querySelector('.slot');
  if (slot.dataset.open === a.dataset.act) { slot.innerHTML = ''; slot.dataset.open = ''; return; }
  slot.dataset.open = a.dataset.act;
  if (a.dataset.act === 'ev') {
    slot.innerHTML = `<div class="ev">${r.evidence.map(e =>
      `<div><span class="ln">${e.line}</span><b>${e.role}</b> · ${esc(e.speaker || '')}: ${esc(e.text)}</div>`).join('')}</div>`;
  } else {
    const lines = await (await fetch(`/api/transcript?genuuid=${encodeURIComponent(r.source.genuuid)}`)).json();
    const marked = new Set(r.evidence.map(e => e.line));
    slot.innerHTML = `<div class="tr">${lines.map((l, i) =>
      `<div id="t${i}" class="${marked.has(i) ? 'hl' : ''}"><span class="ln">${i}</span>${esc(l)}</div>`).join('')}</div>`;
    const first = Math.min(...marked), box = slot.querySelector('.tr');
    box.scrollTop = Math.max(0, box.querySelector(`#t${first}`).offsetTop - box.offsetTop - 40);
  }
}

async function startExtract() {
  await fetch('/api/extract', { method: 'POST', body: JSON.stringify(sel) });
  const target = { ...sel };
  const poll = async () => {
    const d = await loadDrivers();
    const job = d.jobs[`${target.level}|${target.name}`];
    if (sel && sel.level === target.level && sel.name === target.name) await select(target.level, target.name);
    if (job && job.state === 'running') setTimeout(poll, 3000);
  };
  poll();
}

// live search as you type, except in LLM mode, where each search is an LLM call: press Enter
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  if (!$('llm').checked || !$('q').value.trim()) timer = setTimeout(renderSearch, 350);
});
// left panel: expand / collapse every level, or hide the panel entirely
const setAll = open => document.querySelectorAll('#tree details').forEach(d => { d.open = open; });
$('expand').onclick = () => setAll(true);
$('collapse').onclick = () => setAll(false);
$('hide').onclick = () => { $('side').classList.add('hidden'); $('show').hidden = false; };
$('show').onclick = () => { $('side').classList.remove('hidden'); $('show').hidden = true; };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); showTab('search'); renderSearch(); } });
$('llm').addEventListener('change', () => { $('q').placeholder = placeholder(); if (!$('llm').checked) renderSearch(); });
const placeholder = () => $('llm').checked
  ? 'Type what the customer said, then press Enter'
  : 'Type what the customer said (searches as you type)';
$('known').addEventListener('change', () => { renderShowcase(); renderSearch(); });
$('agent').addEventListener('change', renderSearch);
$('min').addEventListener('change', renderSearch);
const showTab = name => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
  ['cluster', 'search', 'showcase'].forEach(t => { $(t).hidden = name !== t; });
  $('knownopt').hidden = name === 'cluster';
};
document.querySelectorAll('.tab').forEach(t => { t.onclick = () => showTab(t.dataset.tab); });
(async () => {
  $('q').placeholder = placeholder();
  await loadDrivers();
  // #L2/Power%20and%20Charging opens that driver directly
  const m = location.hash.match(/^#(L[123])\/(.+)$/);
  if (m) select(m[1], decodeURIComponent(m[2])); else selectAll();
})();
</script>
</body>
</html>
